name: btsradar
options:
  bundleIdPrefix: cz.mares
targets:
  btsradar:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.mares.btsradar
        PRODUCT_NAME: BTS Radar PM
        INFOPLIST_FILE: iosApp/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
